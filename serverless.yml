service: tekkzy-fit-api
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${self:custom.stage.${self:provider.stage}.region}
  memorySize: 256
  timeout: 20
  environment:
    STAGE: ${self:provider.stage}
    INSTITUTION: Fitnessworld001
    PROFILE_TABLE_NAME: ${self:custom.stage.${self:provider.stage}.profileTable}
    PAYMENT_TABLE_NAME: ${self:custom.stage.${self:provider.stage}.paymentTable}
    PRODUCT_TABLE_NAME: ${self:custom.stage.${self:provider.stage}.productTable}
    REPORT_TABLE_NAME: ${self:custom.stage.${self:provider.stage}.reportTable}
    CODEGEN_TABLE_NAME: ${self:custom.stage.${self:provider.stage}.codegenTable}
    CODEGEN_TABLE_REGION: ${self:custom.stage.${self:provider.stage}.codegenRegion}
    RAZORPAY_MODE: ${self:custom.stage.${self:provider.stage}.razorpayMode}
    RAZORPAY_KEY_ID: ${self:custom.stage.${self:provider.stage}.razorpayKeyId}
    RAZORPAY_SECRET_KEY: ${self:custom.stage.${self:provider.stage}.razorpaySecret}
    RAZORPAY_TEST_KEY_ID: ${env:RAZORPAY_TEST_KEY_ID}
    RAZORPAY_TEST_SECRET_KEY: ${env:RAZORPAY_TEST_SECRET_KEY}
    RAZORPAY_WEBHOOK_SECRET: ${self:custom.stage.${self:provider.stage}.razorpayWebhook}
    GYM_API_KEY: ${env:GYM_API_KEY}
    COGNITO_USER_POOL_ID: ${self:custom.stage.${self:provider.stage}.cognitoPoolId}
    COGNITO_CLIENT_ID: ${self:custom.stage.${self:provider.stage}.cognitoClientId}
    COGNITO_REGION: ${self:custom.stage.${self:provider.stage}.cognitoRegion}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.profileTable}
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.profileTable}/index/*
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.paymentTable}
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.paymentTable}/index/*
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.reportTable}
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.reportTable}/index/*
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.productTable}
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.region}:*:table/${self:custom.stage.${self:provider.stage}.productTable}/index/*
            - arn:aws:dynamodb:${self:custom.stage.${self:provider.stage}.codegenRegion}:*:table/${self:custom.stage.${self:provider.stage}.codegenTable}
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource:
            - arn:aws:cognito-idp:${self:custom.stage.${self:provider.stage}.cognitoRegion}:*:userpool/${self:custom.stage.${self:provider.stage}.cognitoPoolId}
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: '*'

custom:
  stage:
    dev:
      region: us-east-2
      profileTable: beta_user_profile
      paymentTable: beta_payment
      productTable: beta_institute_product
      reportTable: beta_monthly_report
      codegenTable: beta_code_generator_variables
      codegenRegion: us-east-2
      cognitoRegion: us-east-2
      cognitoPoolId: ${env:COGNITO_USER_POOL_ID}
      cognitoClientId: ${env:COGNITO_CLIENT_ID}
      razorpayMode: test
      razorpayKeyId: ${env:RAZORPAY_TEST_KEY_ID}
      razorpaySecret: ${env:RAZORPAY_TEST_SECRET_KEY}
      razorpayWebhook: ${env:RAZORPAY_WEBHOOK_SECRET}
    prod:
      region: us-east-1
      profileTable: user_profile
      paymentTable: payment
      productTable: institute_product
      reportTable: monthly_report
      codegenTable: code_generator_variables
      codegenRegion: us-east-1
      cognitoRegion: us-east-2
      cognitoPoolId: ${env:COGNITO_USER_POOL_ID}
      cognitoClientId: ${env:COGNITO_CLIENT_ID}
      razorpayMode: live
      razorpayKeyId: ${env:RAZORPAY_LIVE_KEY_ID}
      razorpaySecret: ${env:RAZORPAY_LIVE_SECRET_KEY}
      razorpayWebhook: ${env:RAZORPAY_WEBHOOK_SECRET_LIVE}
  cors:
    origin: '*'
    headers:
      - Content-Type
      - Authorization
      - X-Gym-Key
      - X-Institution
      - X-Razorpay-Signature
      - X-Amz-Date
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
    allowCredentials: false

functions:
  auth:
    handler: src/auth.handler
    events:
      - http:
          path: auth/login
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: auth/forgot
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: auth/confirm-forgot
          method: ANY
          cors: ${self:custom.cors}

  members:
    handler: src/members.handler
    events:
      - http:
          path: members
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: members/{id}
          method: ANY
          cors: ${self:custom.cors}

  payments:
    handler: src/payments.handler
    events:
      - http:
          path: payments
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: payments/{id}
          method: ANY
          cors: ${self:custom.cors}

  plans:
    handler: src/plans.handler
    events:
      - http:
          path: plans
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: plans/{id}
          method: ANY
          cors: ${self:custom.cors}

  devices:
    handler: src/devices.handler
    timeout: 29
    events:
      - http:
          path: devices/{proxy+}
          method: ANY
          cors: ${self:custom.cors}

  settings:
    handler: src/settings.handler
    events:
      - http:
          path: settings
          method: ANY
          cors: ${self:custom.cors}

  sync:
    handler: src/sync.handler
    events:
      - http:
          path: sync/push
          method: ANY
          cors: ${self:custom.cors}
      - http:
          path: sync/pull
          method: ANY
          cors: ${self:custom.cors}

  reports:
    handler: src/reports.handler
    events:
      - http:
          path: reports/monthly
          method: ANY
          cors: ${self:custom.cors}

  reportsDaily:
    handler: src/reports.daily

  reminders:
    handler: src/reminders.handler
    timeout: 60
    events:
      - http:
          path: reminders/run
          method: ANY
          cors: ${self:custom.cors}

  remindersDaily:
    handler: src/reminders.daily
    timeout: 90

  webhook:
    handler: src/webhook.handler
    events:
      - http:
          path: webhooks/razorpay
          method: POST
          cors: ${self:custom.cors}
      - http:
          path: webhooks/razorpay
          method: GET
          cors: ${self:custom.cors}

resources:
  Resources:
    ExpiryReminderScheduleRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Policies:
          - PolicyName: InvokeExpiryReminders
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt RemindersDailyLambdaFunction.Arn
    ExpiryReminderSchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: ${self:service}-${self:provider.stage}-expiry-reminders-4am-ist
        Description: Monthly report snapshot, then 2-day expiry SMS, daily at 4:00 AM IST
        FlexibleTimeWindow:
          Mode: 'OFF'
        ScheduleExpression: cron(0 4 * * ? *)
        ScheduleExpressionTimezone: Asia/Kolkata
        State: ENABLED
        Target:
          Arn: !GetAtt RemindersDailyLambdaFunction.Arn
          RoleArn: !GetAtt ExpiryReminderScheduleRole.Arn
    ExpiryReminderSchedulePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref RemindersDailyLambdaFunction
        Action: lambda:InvokeFunction
        Principal: scheduler.amazonaws.com
        SourceAccount: !Ref AWS::AccountId
